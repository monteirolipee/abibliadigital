services:
  abibliadigital-app:
    build: ./docker-api
    command:
      - bash
      - /usr/src/api/start.sh

    expose:
      - "3000"

    restart: always

    volumes:
      - ../abibliadigital:/usr/src/api

    depends_on:
      - abibliadigital-redis

  abibliadigital-redis:
    image: redis:alpine

    command: redis-server

    expose:
      - "6379"

    restart: always

    volumes:
      - ../redis-data:/data
