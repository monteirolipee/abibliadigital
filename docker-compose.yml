services:
  abibliadigital-app:
    build:
      context: .
      dockerfile: docker-api/Dockerfile
    command:
      - bash
      - /usr/src/api/start.sh

    ports:
      - "3000:3000"

    expose:
      - "3000"

    restart: always

    environment:
      MONGODB_URI: mongodb://abibliadigital-mongo/abibliadigital
      NODE_ENV: development
      SECRET_KEY: 19B2AFFC3B287A4E41FA7C1158A8A
      REDIS_URL: redis://abibliadigital-redis

    depends_on:
      - abibliadigital-redis
      - abibliadigital-mongo

  abibliadigital-redis:
    image: redis:alpine

    command: redis-server

    expose:
      - "6379"

    restart: always

    volumes:
      - redis-data:/data

  abibliadigital-mongo:
    build: ./docker-mongo

    expose:
      - "27017"

    restart: always

    volumes:
      - mongo-data:/data/db
      - mongo-log:/var/log/mongodb

volumes:
  redis-data:
  mongo-data:
  mongo-log:
